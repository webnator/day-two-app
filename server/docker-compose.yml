# Solo para desarrollo local: buzón SMTP de pruebas (no entrega correo real a Internet).
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: daytwo-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_HTTP_PORT:-8025}:8025" # UI + API HTTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
